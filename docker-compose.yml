# ---------------------------------------------------------------------------
# Infraestructura local de la prueba técnica (endurecida).
#
# Cambios respecto al scaffolding heredado (ver SECURITY.md y DECISIONS.md):
#   - Sin credenciales en claro: todo viene de .env (`${VAR:?}` falla si falta).
#   - MinIO eliminado: ningún dato del paquete pasa por S3 (ADR-001).
#   - Imágenes con versión fija, no `latest`.
#   - Puertos publicados solo en 127.0.0.1, parametrizados.
#   - Healthchecks reales: `make up` usa `--wait` y termina cuando están sanos.
#   - Postgres con autenticación scram-sha-256 y sin trust.
#   - Contenedores sin escalada de privilegios.
# ---------------------------------------------------------------------------
name: bia_prueba

services:
  postgres:
    image: postgres:16.9-alpine
    container_name: bia_pg
    environment:
      POSTGRES_USER: ${PG_SUPERUSER:?definir PG_SUPERUSER en .env}
      POSTGRES_PASSWORD: ${PG_SUPERPASSWORD:?definir PG_SUPERPASSWORD en .env}
      POSTGRES_DB: ${PG_DATABASE:-bia_datos}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "${PG_BIND:-127.0.0.1}:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v26.2.6
    container_name: bia_redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:${KAFKA_PORT:-9092}
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:\\s+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
