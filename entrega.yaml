# ===========================================================================
# MANIFIESTO DE ENTREGA  --  OBLIGATORIO, en la raiz del zip
#
# El evaluador lee este archivo para saber como conectarse a tu solucion y
# que objetos revisar. Si falta o esta mal formado, los checks de seguridad
# no se pueden ejecutar y se califican en cero.
#
# Cuando termines de llenarlo, con la infra arriba:   make verificar
# Se conecta con los tres roles y busca los objetos que nombraste. No califica
# nada: solo te dice si el evaluador va a poder conectarse.
# ===========================================================================

