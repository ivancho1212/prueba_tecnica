# ===========================================================================
# Clasificación de datos (C1). ARTEFACTO VIVO: src/bia/classification.py lo
# carga y el pipeline lo consulta para decidir qué cifra, qué enmascara, qué
# puede ir a logs y qué puede exponer la vista del analista. Al arrancar,
# `make up` y el pipeline comparan este archivo con information_schema: una
# columna sin clasificar detiene la corrida.
#
# Niveles (Ley 1581 / ISO 27001 A.5.12 Clasificación de la información):
#   Público          puede salir de la organización sin daño.
#   Interno          operación normal; no sale sin autorización.
#   Confidencial     daño comercial/legal si se filtra (empresa, finanzas).
#   Restringido-PII  dato personal o identificador de persona/empresa sujeto a
#                    Ley 1581: cifrado en reposo, nunca en logs ni en analytics.
# ===========================================================================
version: 1
actualizado: "2026-11-11"

politicas:
  Público:         { cifrado_en_reposo: false, en_logs: true,  en_vista_analista: true,  en_cuarentena_en_claro: true  }
  Interno:         { cifrado_en_reposo: false, en_logs: true,  en_vista_analista: true,  en_cuarentena_en_claro: true  }
  Confidencial:    { cifrado_en_reposo: false, en_logs: false, en_vista_analista: false, en_cuarentena_en_claro: true  }
  Restringido-PII: { cifrado_en_reposo: true,  en_logs: false, en_vista_analista: false, en_cuarentena_en_claro: false }

# --- Campos de los archivos crudos: gobiernan la ingesta -------------------
campos_origen:
  clientes.csv:
    cliente_id:          Interno
    razon_social:        Confidencial
    nit:                 Restringido-PII
    email_contacto:      Restringido-PII
    celular_contacto:    Restringido-PII
    direccion:           Restringido-PII
    ciudad:              Interno
    departamento:        Interno
    representante_legal: Restringido-PII
    observaciones:       Restringido-PII     # texto libre con correos, celulares y cédulas
  fronteras.csv:
    frontera_id: Interno
    codigo_sic: Interno
    cliente_id: Interno
    mercado: Interno
    operador_red: Interno
    nivel_tension: Interno
    fecha_registro: Interno
    estado: Interno
  limites_frontera.csv:
    frontera_id: Interno
    min_kwh: Interno
    max_kwh: Interno
  consumos.csv:
    frontera_id: Interno
    timestamp: Interno
    consumo_kwh: Interno
    unidad: Interno
    version_lectura: Interno
    calidad_lectura: Interno
  facturacion.json:
    factura_id: Interno
    frontera_id: Interno
    cliente.nit: Restringido-PII
    cliente.razon_social: Confidencial
    cliente.email_facturacion: Restringido-PII
    consumo_facturado_kwh: Interno
    tarifa_cop_kwh: Confidencial
    valor_total_cop: Confidencial
    componentes: Confidencial
    metodo_pago.tipo: Interno
    metodo_pago.cuenta_enmascarada: Confidencial
  mediciones_stream.ndjson:
    evento_id: Interno
    frontera_id: Interno
    ts_medicion: Interno
    kwh: Interno
    medidor.serial: Interno
    medidor.firmware: Interno

# --- Columnas físicas del modelo (deben coincidir 1:1 con information_schema) --
